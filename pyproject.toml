[project]
name = "ppgrid"
version = "0.2.1"
description = "Fast continent-scale raster interpolation for scattered point data using pull-push mipmap algorithms. Turns millions of geolocated points into gapless GeoTIFF in minutes. No GPU required."
readme = "README.md"
license = "MIT"
authors = [{ name = "Andryo Marzuki", email = "andryo@mrzk.io" }]
keywords = [
    "interpolation",
    "idw",
    "geospatial",
    "raster",
    "geotiff",
    "gis",
    "mipmap",
    "spatial-analysis",
    "scattered-data",
    "gridding",
    "python",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "pyproj>=3.6,<4",
    "rasterio>=1.3,<2",
]

[project.optional-dependencies]
dev = ["ruff>=0.1", "pytest>=8.0", "pre-commit>=4.0"]
parquet = ["pyarrow"]

[project.urls]
Homepage = "https://github.com/marzukia/ppgrid"
Repository = "https://github.com/marzukia/ppgrid"
Issues = "https://github.com/marzukia/ppgrid/issues"

[project.scripts]
ppgrid = "ppgrid.idwgrid:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "COM812",     # missing-trailing-comma — conflicts with the ruff formatter (formatter adds it)
    "rule-codes-in-selectors",   # RUF022 — pedantic; we use codes in select/ignore alongside ALL
    "any-type",   # Any allowed in **kwargs annotations
    "missing-copyright-notice",   # no copyright headers needed
    "complex-structure",     # function too complex (choose_transform)
    "incorrect-blank-line-before-class",     # conflicts with D211 (must pick one)
    "multi-line-summary-second-line",     # conflicts with D212 (must pick one)
    "subclass-builtin",  # dict subclassing for JSON serialization
    "too-many-arguments",  # too many args (numerical function signatures)
    "too-many-locals",  # too many local variables (pipeline functions)
    "too-many-statements",  # too many statements (pipeline function)
    "too-many-positional-arguments",  # too many positional arguments (numerical functions)
    "typing-only-standard-library-import",    # Callable used at runtime in function signatures
    "assert",      # assert usage in tests
    "magic-value-comparison",   # magic value comparison in tests
    "numpy-legacy-random",    # numpy legacy random in tests
    "float-equality-comparison",   # float equality comparison in tests
    "import-outside-top-level",   # import outside top-level (pyarrow lazy import)
    "docstring-missing-returns",    # docstring missing returns (test helper functions)
    "import-private-name",    # import private name (test imports _smooth3)
]

[tool.ruff.lint.per-file-ignores]
# examples/run_melb.py is a runnable repro script; its prints are the output.
"examples/run_melb.py" = ["print"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["ppgrid"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


