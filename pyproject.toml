[project]
name = "ppgrid"
version = "0.5.0"
description = "Fast continent-scale raster interpolation for scattered point data using pull-push mipmap algorithms. Turns millions of geolocated points into gapless GeoTIFF in minutes. No GPU required."
readme = "README.md"
license = "MIT"
authors = [{ name = "Andryo Marzuki", email = "andryo@mrzk.io" }]
keywords = [
    "interpolation",
    "idw",
    "geospatial",
    "raster",
    "geotiff",
    "gis",
    "mipmap",
    "spatial-analysis",
    "scattered-data",
    "gridding",
    "python",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "pyproj>=3.6,<4",
    "rasterio>=1.3,<2",
    "rich>=13.7,<14",
]

[project.optional-dependencies]
dev = ["ruff>=0.1", "pytest>=8.0", "pre-commit>=4.0"]
parquet = ["pyarrow"]
# Independent IDW / nearest-NN baselines (ppgrid.baselines, issue #107).
# scipy is the only baseline consumer; the core install stays lean.
baselines = ["scipy>=1.14,<2"]

[project.urls]
Homepage = "https://github.com/marzukia/ppgrid"
Repository = "https://github.com/marzukia/ppgrid"
Issues = "https://github.com/marzukia/ppgrid/issues"

[project.scripts]
ppgrid = "ppgrid.pipeline:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "COM812",     # missing-trailing-comma — conflicts with the ruff formatter (formatter adds it)
    "rule-codes-in-selectors",   # RUF022 — pedantic; we use codes in select/ignore alongside ALL
    "any-type",   # Any allowed in **kwargs annotations
    "missing-copyright-notice",   # no copyright headers needed
    "too-many-statements-in-try-clause",  # too many statements in try (reproject block)
    "too-many-nested-blocks",  # too many nested blocks (reproject block)
    "complex-structure",     # function too complex (Pipeline.run)
    "incorrect-blank-line-before-class",     # conflicts with D211 (must pick one)
    "multi-line-summary-second-line",     # conflicts with D212 (must pick one)
    "subclass-builtin",  # dict subclassing for JSON serialization
    "too-many-branches",  # too many branches (pipeline function)
    "too-many-arguments",  # too many args (numerical function signatures)
    "too-many-locals",  # too many local variables (pipeline functions)
    "too-many-statements",  # too many statements (pipeline function)
    "too-many-positional-arguments",  # too many positional arguments (numerical functions)
    "typing-only-standard-library-import",    # Callable used at runtime in function signatures
    "assert",      # assert usage in tests
    "magic-value-comparison",   # magic value comparison in tests
    "numpy-legacy-random",    # numpy legacy random in tests
    "float-equality-comparison",   # float equality comparison in tests
    "literal-membership",     # literal membership (list vs set in tests)
    "pytest-raises-ambiguous-pattern",     # pytest raises ambiguous pattern
    "import-outside-top-level",   # import outside top-level (optional pyarrow in Pipeline.ingest)
    "undocumented-public-package",    # undocumented public package (tests/__init__.py)
    "docstring-missing-returns",    # docstring missing returns (test helper functions)
    "import-private-name",    # import private name (test imports _smooth3)
    "future-rewritable-type-annotation",     # missing from __future__ import annotations
]

[tool.ruff.lint.per-file-ignores]
# ppgrid/__init__.py: the public surface (issue #109) is exposed lazily via
# PEP 562 __getattr__; the __all__ names are undefined at module scope by
# design, and the lazy layer is the module's reason to exist.
"ppgrid/__init__.py" = [
    "undefined-export",        # F822: __all__ names resolve via __getattr__
    "non-empty-init-module",   # RUF067: __getattr__/version are the lazy surface
]
# ppgrid/turbop.py probes platform RAM via /usr/sbin/sysctl on darwin (fixed
# argv, no shell); the strict subprocess rules fit build glue, not a probe.
"ppgrid/turbop.py" = [
    "suspicious-subprocess-import",   # S404: sysctl fixed argv, no shell
]
# ppgrid/_cinterp.py is JIT-build glue: a subprocess cc call and module-level
# backend state are the whole point; the strict rules fit its callers, not it.
"ppgrid/_cinterp.py" = [
    "suspicious-subprocess-import",   # S404: cc with fixed flags, no shell
    "global-statement",     # module-level backend state (_mod/_reason/_build_err)
    "subprocess-without-shell-equals-true",   # no shell, fixed argv
    "subprocess-run-without-check",   # returncode checked explicitly
    "raise-within-try",     # import-failure diagnostics
    "try-consider-else",    # diagnostic bookkeeping
    "type-check-without-type-error",    # capability probe (callable check)
]
# ppgrid/ui.py: Phase and UI are one design unit - Phase delegates to the
# UI's private _phase_* methods and the pipeline touches _task_id via
# _finish_phase. The coupling is intentional; the public API is UI/Phase.
"ppgrid/ui.py" = [
    "private-member-access",
]
# tests/test_cinterp.py pokes at private state (_mod, _p) on purpose and
# resolves the PPGRID_CINTERP backend in fresh interpreters (issue #109).
"tests/test_cinterp.py" = [
    "private-member-access",    # fallback simulation + transform internals
    "suspicious-subprocess-import",   # S404: own interpreter, fixed argv
    "subprocess-run-without-check",   # returncode asserted explicitly
    "subprocess-without-shell-equals-true",   # no shell, fixed argv
    "hardcoded-temp-file",    # S108: FMA_PROBE_REPORT is the fixed CI contract (ci.yml cats it)
    "print",   # T201: probe report echo (also surfaced by the ci.yml cat step)
]
# tests/test_os_portability.py simulates other OSes: it pokes private state
# (_MADVISE, _STATE, _read_physical_gb) and runs the venv interpreter directly.
"tests/test_os_portability.py" = [
    "private-member-access",    # degraded-state pokes
    "suspicious-subprocess-import",   # S404: own interpreter, fixed argv
    "subprocess-without-shell-equals-true",   # no shell, fixed argv
    "subprocess-run-without-check",   # returncode checked explicitly
]
# tests/test_audit_84.py runs the venv interpreter directly for the shim
# (`python -m ppgrid.idwgrid`) and touches the summary JSON internals.
"tests/test_audit_84.py" = [
    "suspicious-subprocess-import",   # S404: own interpreter, fixed argv
    "subprocess-run-without-check",   # returncode asserted explicitly
    "private-member-access",    # _sanitize_json is the unit under test
]
# tests/test_tier2_shared.py wraps _prepare_shared to capture the per-box refs
# before the write phase releases cfg.pts (Windows WinError 32 fix).
"tests/test_tier2_shared.py" = [
    "private-member-access",    # harness wraps _prepare_shared
]
# Lazy native stack (PEP 562): the TYPE_CHECKING blocks declare the names
# for static analysis; _load_native() binds them at first use (runtime).
# run()/main() document the exceptions the phases (ingest/grid/turbo
# precheck) raise; they propagate, not raise in-body (DOC502).
"ppgrid/pipeline.py" = ["TC004", "DOC502"]
"ppgrid/zstdmt.py" = ["TC004"]
# Fresh-interpreter probes: the code strings are our own constants.
"tests/test_lazy_imports.py" = [
    "S404",   # suspicious subprocess import
    "S603",   # subprocess.run([sys.executable, -c, <own constant>])
]
# tests/test_cli_verify.py runs fresh-interpreter lazy-import probes (#69) and
# drives the CLI in-process; the subprocess calls are own-argv, no shell.
"tests/test_cli_verify.py" = [
    "S404",   # suspicious subprocess import
    "S602",   # subprocess.run([sys.executable, -c, <own constant>]), no shell
    "S603",   # returncode asserted explicitly
]
# tests/test_public_api.py runs fresh-interpreter guards (issue #109).
"tests/test_public_api.py" = [
    "S404",   # suspicious subprocess import
    "S603",   # subprocess.run([sys.executable, -c, <own constant>])
]

# tests/test_run_summary.py drives the adaptive table layout through the
# Progress instance (private _progress) and the pure helpers on purpose.
"tests/test_run_summary.py" = [
    "private-member-access",    # layout snapshots reach into UI internals
]
# tests/test_cli_help.py reads parser internals and runs the epilog examples.
"tests/test_cli_help.py" = [
    "private-member-access",    # parser._actions / _action_groups
    "suspicious-subprocess-import",    # [sys.executable, -m ppgrid, ...] fixed argv
    "subprocess-run-without-check",    # returncode asserted explicitly
    "subprocess-without-shell-equals-true",    # fixed argv, no shell
]
# tests/test_cli_subcommands.py drives the subcommand CLI in fresh
# interpreters ([sys.executable, -m ppgrid, ...] fixed argv, returncode
# asserted explicitly) and pins the run-path dispatch.
"tests/test_cli_subcommands.py" = [
    "suspicious-subprocess-import",   # S404: own interpreter, fixed argv
    "subprocess-run-without-check",   # returncode asserted explicitly
    "subprocess-without-shell-equals-true",   # no shell, fixed argv
]
# tests/test_cli_config.py runs a fresh-interpreter init probe (#63).
"tests/test_cli_config.py" = [
    "suspicious-subprocess-import",    # [sys.executable, -c, <own constant>] fixed argv
    "subprocess-without-shell-equals-true",    # no shell, fixed argv
]
# tests/test_cli_interrupt.py spawns the venv interpreter to send it SIGINT
# mid-run, and pokes private state (_EPILOG, _turbo_precheck); no_unlink must
# keep Path.unlink's boolean signature.
"tests/test_cli_interrupt.py" = [
    "suspicious-subprocess-import",   # S404: own interpreter, fixed argv
    "subprocess-without-shell-equals-true",   # no shell
    "private-member-access",    # _EPILOG / _turbo_precheck on purpose
    "FBT001",   # no_unlink mirrors Path.unlink(missing_ok=False)
    "FBT002",
]
# tests/test_readme_flags.py cross-checks the --help text parse against the
# parser's own action list (issue #100 docs smoke).
"tests/test_readme_flags.py" = [
    "private-member-access",    # parser._actions cross-check
]
# examples/run_melb.py is a runnable repro script; its prints are the output.
"examples/run_melb.py" = ["print"]
# tests/fixtures/*.py are runnable fixture generators; prints are the output.
"tests/fixtures/*.py" = [
    "INP001",     # implicit namespace package (script dir)
    "T201",       # print (generator output)
]
# scripts/size_ratchet.py is the CI size gate (harden-repo, 2026-10-20):
# fixed-argv git subprocess calls and stdout gate output are the point.
"scripts/size_ratchet.py" = [
    "suspicious-subprocess-import",   # S404: git with fixed argv, no shell
    "subprocess-without-shell-equals-true",   # fixed argv, no shell
    "start-process-with-partial-path",   # "git" from PATH, no shell
    "print",   # T201: gate output
]
# bench/*.py are local perf/repro harnesses (not shipped); relax style rules.
"bench/*.py" = [
    "INP001",     # implicit namespace package (script dir)
    "D",          # docstring rules (harness scripts)
    "ANN",        # type annotations (monkey-patched signatures)
    "T201",       # print (harness output)
    "SLF001",     # private member access (harness wraps internals)
    "PLW0127",    # unnecessary assign
    "PLW0603",    # global statement
    "C408",       # unnecessary collection call
    "ERA001",     # commented-out code
    "RUF100",     # unused noqa
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# rasterio's MemoryDataset (reproject's ndarray destination) warns NotGeoreferencedWarning
# on the initial transform read of the MEM::: dataset, then sets the real transform.
# pipeline.py ignores the category at first warp (_ensure_warp_ready), but pytest's per-test
# warnings.catch_warnings + simplefilter wipes module filters, so restate it here.
filterwarnings = ["ignore:Dataset has no geotransform:UserWarning"]

[tool.hatch.build]
# Keep the sdist slim: generated rasters/images are committed for GitHub
# (the README references them via absolute raw URLs) but do not ship in the
# package. Regenerate locally with examples/run_melb.py. data/all_equakes.csv
# (8.3 MB, public-domain sample) and data/au_gcc_sparse.csv (53 MB, full-AU
# generated point set) are excluded; data/melb_houses.csv (384 KB) ships.
exclude = [
    "data/all_equakes.csv",
    "data/au_gcc_sparse.csv",
    "examples/*.jpg",
    "examples/*.png",
    "examples/equakes/**",
    "examples/melb/**",
    "tests/fixtures/**",
]

[tool.hatch.build.targets.wheel]
packages = ["ppgrid"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


