[project]
name = "ppgrid"
version = "0.1.2"
description = "Fast continent-scale raster interpolation for scattered point data using pull-push mipmap algorithms. Turns millions of geolocated points into gapless GeoTIFF in minutes — no GPU required."
readme = "README.md"
license = "MIT"
authors = [{ name = "Andryo Marzuki", email = "andryo@mrzk.io" }]
keywords = [
    "interpolation",
    "idw",
    "geospatial",
    "raster",
    "geotiff",
    "gis",
    "mipmap",
    "spatial-analysis",
    "scattered-data",
    "gridding",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "pyproj>=3.6,<4",
    "rasterio>=1.3,<2",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["ruff>=0.1", "pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/marzukia/pullpush"
Repository = "https://github.com/marzukia/pullpush"
Issues = "https://github.com/marzukia/pullpush/issues"

[project.scripts]
ppgrid = "ppgrid.idwgrid:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "ANN401",   # Any allowed in **kwargs annotations
    "CPY001",   # no copyright headers needed
    "PLW0717",  # too many statements in try (reproject block)
    "PLR1702",  # too many nested blocks (reproject block)
    "C901",     # function too complex (Pipeline.run)
    "D203",     # conflicts with D211 (must pick one)
    "D213",     # conflicts with D212 (must pick one)
    "FURB189",  # dict subclassing for JSON serialization
    "PLR0912",  # too many branches (pipeline function)
    "PLR0913",  # too many args (numerical function signatures)
    "PLR0914",  # too many local variables (pipeline functions)
    "PLR0915",  # too many statements (pipeline function)
    "PLR0917",  # too many positional arguments (numerical functions)
    "PLW0603",  # global required for ProcessPoolExecutor initializer
    "TC003",    # Callable used at runtime in function signatures
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["ppgrid"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


