[project]
name = "idwgrid"
version = "0.1.0"
description = "Pull-push scattered-data interpolation for continent-scale rasters"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
]

[project.optional-dependencies]
dev = ["ruff>=0.1", "pyarrow"]

[project.scripts]
idwgrid = "src.idwgrid:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN101",  # missing type self
    "ANN102",  # missing type cls
    "D100",    # missing docstring public module
    "D104",    # missing docstring public package
    "D203",    # one blank line before class
    "D213",    # multi-line summary second line
    "INP001",  # implicit namespace
    "PLR0913", # too many args
    "PLR2004", # magic value
    "S104",    # possible binding to all interfaces
    "SLF001",  # private member access
    "T201",    # print
    "TRY003",  # long message outside exception
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
