[project]
name = "ppgrid"
version = "0.1.3"
description = "Fast continent-scale raster interpolation for scattered point data using pull-push mipmap algorithms. Turns millions of geolocated points into gapless GeoTIFF in minutes — no GPU required."
readme = "README.md"
license = "MIT"
authors = [{ name = "Andryo Marzuki", email = "andryo@mrzk.io" }]
keywords = [
    "interpolation",
    "idw",
    "geospatial",
    "raster",
    "geotiff",
    "gis",
    "mipmap",
    "spatial-analysis",
    "scattered-data",
    "gridding",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "pyproj>=3.6,<4",
    "rasterio>=1.3,<2",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["ruff>=0.1", "pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/marzukia/ppgrid"
Repository = "https://github.com/marzukia/ppgrid"
Issues = "https://github.com/marzukia/ppgrid/issues"

[project.scripts]
ppgrid = "ppgrid.idwgrid:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "any-type",   # Any allowed in **kwargs annotations
    "missing-copyright-notice",   # no copyright headers needed
    "too-many-statements-in-try-clause",  # too many statements in try (reproject block)
    "too-many-nested-blocks",  # too many nested blocks (reproject block)
    "complex-structure",     # function too complex (Pipeline.run)
    "incorrect-blank-line-before-class",     # conflicts with D211 (must pick one)
    "multi-line-summary-second-line",     # conflicts with D212 (must pick one)
    "subclass-builtin",  # dict subclassing for JSON serialization
    "too-many-branches",  # too many branches (pipeline function)
    "too-many-arguments",  # too many args (numerical function signatures)
    "too-many-locals",  # too many local variables (pipeline functions)
    "too-many-statements",  # too many statements (pipeline function)
    "too-many-positional-arguments",  # too many positional arguments (numerical functions)
    "global-statement",  # global required for ProcessPoolExecutor initializer
    "typing-only-standard-library-import",    # Callable used at runtime in function signatures
    "assert",      # assert usage in tests
    "magic-value-comparison",   # magic value comparison in tests
    "numpy-legacy-random",    # numpy legacy random in tests
    "float-equality-comparison",   # float equality comparison in tests
    "literal-membership",     # literal membership (list vs set in tests)
    "pytest-raises-ambiguous-pattern",     # pytest raises ambiguous pattern
    "import-outside-top-level",   # import outside top-level (lazy-loaded reprojection)
    "undocumented-public-package",    # undocumented public package (tests/__init__.py)
    "docstring-missing-returns",    # docstring missing returns (test helper functions)
    "import-private-name",    # import private name (test imports _smooth3)
    "future-rewritable-type-annotation",     # missing from __future__ import annotations
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["ppgrid"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


