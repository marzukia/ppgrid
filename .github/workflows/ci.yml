name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # PRs: full interpreter sweep on GitHub-hosted runners, pinned versions
  # (requires-python >=3.11, classifiers 3.11-3.14; review m6).
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --locked
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev ruff format --check .
      - run: uv run pytest

  # Pushes to main: self-hosted 'nf' runners (2x, label 'nf', marzukia org;
  # scoping per Frank/jarate pattern 2026-10-06). Single leg, the runner's
  # existing interpreter, behaviour unchanged (review m6: matrix is
  # ubuntu-latest-only).
  test-main:
    if: github.event_name == 'push'
    runs-on: nf
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras --locked
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev ruff format --check .
      - run: uv run pytest
