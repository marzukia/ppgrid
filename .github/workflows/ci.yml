name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Runner scoping (2026-10-06, per Frank/jarate pattern): PRs run on
# GitHub-hosted runners; pushes to main run on the self-hosted 'nf'
# runners (2x, label 'nf', marzukia org). 
env:
  RUNNER: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'nf' }}

jobs:
  test:
    runs-on: ${{ env.RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev ruff format --check .
      - run: uv run pytest
