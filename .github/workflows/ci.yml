name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # PRs: full interpreter x OS sweep on GitHub-hosted runners, pinned versions
  # (requires-python >=3.11, classifiers 3.11-3.14; review m6).
  #
  # OS matrix (2026-10-12): explicit Linux/macOS pathways. Windows was
  # EXCLUDED from the matrix 2026-10-12 (operator decision: Unix-only support
  # scope for now) after the portability fixes landed — the CDLL/O_NOFOLLOW/
  # memmap-release fixes stay in the tree as the re-enable base (a windows-
  # latest leg passed everything but one anchor test: melb10 DN data drift
  # on the 3.11 pyproj wheel, 772 max DN delta on cap-boundary cells).
  # - ubuntu-latest  (x86_64, 4 vCPU, 16 GB) — primary; C interp JIT via cc/gcc.
  # - macos-latest   (arm64, ~16 GB) — C interp JIT via clang; proves the
  #   cross-OS C-build bytes in the anchor gate below.
  # All 34 unique packages (36 lock entries) have wheels for cp311-cp314
  # x every platform above (verified against uv.lock 2026-10-12), so
  # `uv sync --all-extras --locked` never needs a source build.
  #
  # Anchor gate: every leg re-runs the CI-safe configs (all six melb
  # resolutions, melb10 the heaviest at 2.4 GB peak RSS measured) and fails
  # when outputs drift from the
  # committed examples/ anchors — byte-exact on canonical x86_64 Linux,
  # functional-equivalence (grid/metadata + decoded pixels) on the other
  # legs. Cross-OS writer drift (GDAL/zstd/libtiff build deltas) is a leg
  # failure, not a warning. equakes-scale anchors
  # (8.1-8.4 GB peak) stay out of the CI anchor scope (Linux/hydrogen-
  # verified via compare_tier2.py); all six melb resolutions fit the CI-safe
  # bound (issue #84 a8: the 25/50/100/250m rasters were previously
  # unanchored).
  test:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --locked
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev ruff format --check .
      - run: uv run pytest
      - name: FMA contraction probe report (darwin arm64 mechanism evidence)
        # The probe test writes /tmp/ppgrid-fma-probe.txt; always() so the
        # report reaches the log even when pytest goes red (PR #128 FMA
        # fix-round iteration 1: 15 bit-identity failures expected, probe
        # itself passes — it documents the mechanism).
        if: always()
        run: |
          if [ -f /tmp/ppgrid-fma-probe.txt ]; then
            cat /tmp/ppgrid-fma-probe.txt
          else
            echo "(no FMA probe report: non-darwin platform, or probe skipped)"
          fi
      - name: Anchor gate (byte-exact on canonical x86_64 Linux; functional-equivalence elsewhere)
        run: uv run python bench/check_anchors.py

  # Pushes to main: GitHub-hosted, single leg (review m6: matrix is PR-only).
  # 2026-10-08: was runs-on 'nf' — that label points at the
  # nestfinderau/nestfinder REPO runners (label 'nestfinder-ci'); nothing
  # named 'nf' is registered on the marzukia account, so the first main
  # push (#39 merge) queued 9.5h starved. Wire real self-hosted runners
  # to this account before switching back.
  # Anchor gate added 2026-10-12: the six melb resolutions fit the 16 GB
  # runner (melb10 = 2.4 GB peak RSS, measured on hydrogen; the rest are
  # coarser and lighter).
  test-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          # Pinned explicitly: CI must not depend on the runner's ambient
          # Python. 3.13 = the version this repo develops on.
          python-version: "3.13"
      - run: uv sync --all-extras --locked
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev ruff format --check .
      - run: uv run pytest
      - name: Anchor gate (outputs must be byte-identical to committed examples)
        run: uv run python bench/check_anchors.py

  # Deterministic size gate (harden-repo skill, 2026-10-20): line ratchet
  # (size-ratchet.json budgets may only shrink) + AST top-level-unit gate vs
  # the PR base. Pushes to main run the line ratchet only (no base ref -> no
  # diff gate). Stdlib-only script, no third-party deps.
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          # Pinned to match the other legs; the gate script itself is stdlib-only.
          python-version: "3.13"
      - run: uv sync --all-extras --locked
      - run: uv run python scripts/size_ratchet.py --base "${GITHUB_BASE_REF}"

  # Built-artifact gate (issue #98): uv build -> fresh stdlib venv (plain
  # pip, no dev extras) -> installed console-script e2e -> anchor gate.
  # The wheel must install and run on every OS in the matrix (s2: per-OS
  # install). Byte-exact anchor matching applies only on canonical x86_64
  # Linux; every other leg gets functional-equivalence (same rules as
  # bench/check_anchors.py). The e2e venv pins its runtime deps to uv.lock
  # before the anchor gate: the anchors were cut on that toolchain, and a
  # fresh pip resolution drifts the grid transform by ~1e-15, changing
  # output bytes on every OS (decoded pixels stay identical) — see
  # scripts/check_artifact.sh. The fresh install itself still runs first,
  # so per-OS wheel availability + pip metadata stay exercised.
  artifact:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - name: Build wheel + sdist
        run: uv build
      - name: "Wheel: clean-venv install + e2e + anchor gate + Parquet e2e (items 1-4, 7)"
        run: scripts/check_artifact.sh dist/ppgrid-*-py3-none-any.whl parquet
      - name: Dependency vuln scan (item 8)
        # Fail threshold: pip-audit exits 1 on ANY known vulnerability in
        # the installed dep tree (default PyPI advisory service). No
        # --ignore-vuln suppressions; triage = bump the dep in pyproject
        # and relock. The scan runs on the pinned (uv.lock) tree, i.e. the
        # dependency set this repo actually ships. The installed set is
        # rendered as name==version (pip freeze emits file:// direct refs
        # for the locally installed wheel, which pip-audit cannot parse),
        # deduped (importlib.metadata can double-count on multiarch
        # lib/lib64 venvs), and the project itself is excluded (pip-audit -r
        # resolves every line against PyPI; the in-flight version is not
        # published until the release). The venv's own pip/setuptools are
        # excluded too: tooling of the disposable CI venv, not artifact
        # runtime deps (a fresh ensurepip pip can carry advisories before
        # it is ever used).
        run: |
          PROJ=$(/tmp/ppgrid-artifact-venv/bin/python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')
          /tmp/ppgrid-artifact-venv/bin/python - <<'PY' | sort -u | grep -vE "^(${PROJ}|pip|setuptools)==" > /tmp/ppgrid-audit-deps.txt
          import importlib.metadata as m
          for d in m.distributions():
              name = d.metadata.get("Name")
              if name:
                  print(f"{name}=={d.version}")
          PY
          uvx --from pip-audit pip-audit -r /tmp/ppgrid-audit-deps.txt
      - name: "sdist: clean-venv install + console-script works (item 5, ubuntu leg only)"
        if: runner.os == 'Linux'
        run: scripts/check_artifact.sh dist/ppgrid-*.tar.gz
